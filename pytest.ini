[pytest]
testpaths = tests
pythonpath = .
addopts =
    --verbose
    --tb=short
    --capture=tee-sys
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    --alluredir=allure-results
    --clean-alluredir
markers =
    hardware: requires the real UDP/TCP hardware-in-the-loop environment
    offline: runs locally without external hardware
