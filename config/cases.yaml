- case_id: "case_001_udp_demo"
  description: "第一轮半实物仿真：期望三轴角速度收敛并进入稳定模式"
  initial_condition:
    orbit:
      semi_major_axis_m: 6871000
      eccentricity: 0.001
      inclination_deg: 97.4
      raan_deg: 0.0
      arg_perigee_deg: 0.0
      mean_anomaly_deg: 0.0
    year: 2025
    date_time:
      month: 6
      date: 1
      hour: 12
      minute: 0
      second: 0
    attitude:
      roll: 0.0
      pitch: 0.0
      yaw: 0.0
      roll_angular_velocity: 0.0
      pitch_angular_velocity: 0.0
      yaw_angular_velocity: 0.0
    Spare1:
      spare1: 0.0
      spare2: 0.0
      spare3: 0.0
      spare4: 0.0
      spare5: 0.0
      spare6: 0.0
    Spare2:
      spare7: 0.0
      spare: 0.0
      spare8: 0.0
    Config:
      Attitude_dynamics_open_closed_loop_control: 1
      Orbit_open_closed_loop_control: 1
      Reset: [0, 1]
      Initial_orbit_standard: 1
      
  expected:
    final_control_mode: "STABLE"
    angular_rate_converged: true

