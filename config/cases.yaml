- case_id: "case_001"
  description: "第一轮半实物仿真：阳照初期"
  initial_condition:
    orbit:
      semi_major_axis_m: 6878137
      eccentricity: 0.001
      inclination_deg: 90.0
      raan_deg: 90.0
      arg_perigee_deg: 0.0
      mean_anomaly_deg: 271.2049
    year: 2026
    date_time:
      month: 6
      date: 26
      hour: 0
      minute: 0
      second: 0
    attitude:
      roll: 15.0
      pitch: 15.0
      yaw: 15.0
      roll_angular_velocity: 0.0
      pitch_angular_velocity: 0.0
      yaw_angular_velocity: 0.0
    Spare1:
      spare1: 0.0
      spare2: 0.0
      spare3: 0.0
      spare4: 0.0
      spare5: 0.0
      spare6: 0.0
    Spare2:
      spare7: 0.0
      spare8: 0.0
      spare9: 0.0
    Config:
      Attitude_dynamics_open_closed_loop_control: 1
      Orbit_open_closed_loop_control: 1
      Reset: [0, 1]
      Initial_orbit_standard: 2
  telecommand:
    command_codes:
      - "K3072"
      - "TEMP031"
      - "K3006"
      - command_code: "ZS300"
        sync_reset_start: true
      - "K3139"
      - "K3117"
      - "TEMP041"
      - "K3036"
  checks:
    - type: "mode"
      name: "控制模态"
      field: "control_mode"
      expected: "3"
      start_when:
        #all, 全部满足; any, 任意一个满足
        match: "all"
        #eq     等于
        #ne     不等于
        #lt     小于
        #le     小于等于
        #gt     大于
        #ge     大于等于
        #abs_lt 绝对值小于
        #abs_le 绝对值小于等于
        conditions:
          - field: "roll"
            operator: "abs_lt"
            value: 1.0
          - field: "pitch"
            operator: "abs_lt"
            value: 1.0
    - type: "mode"
      name: "姿态选择基准"
      field: "attitude_reference"
      expected: "3"
    - type: "convergence"
      name: "三轴姿态角收敛"
      fields: ["roll", "pitch", "yaw"]
      targets: 0.0
      tolerances: 0.5
      hold_sec: 60.0

