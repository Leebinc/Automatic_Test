udp:
  host: "192.168.0.7"
  port: 26083
  timeout_sec: 2.0

tcp:
  host: "192.168.0.12"
  port: 502
  timeout_sec: 2.0
  recv_buffer_size: 4096
  connect_retry_timeout_sec: 20.0
  connect_retry_interval_sec: 5
  idle_disconnect_sec: 60.0
  poll_interval_sec: 2.0
  heartbeat_interval_sec: 40.0
  telemetry_poll_codes:
    - "ROLL"
    - "PITCH"
    - "YAW"
    - "MODE"
    - "ATT_REF"
  telemetry_frame_field_codes:
