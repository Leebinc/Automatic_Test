udp:
  host: "192.168.0.7"
  port: 26083
  timeout_sec: 2.0

tcp:
  host: "192.168.0.11"
  port: 502
  timeout_sec: 2.0
  recv_buffer_size: 4096
  connect_retry_timeout_sec: 20.0
  connect_retry_interval_sec: 5
  poll_interval_sec: 2.0
  heartbeat_interval_sec: 40.0
  telemetry_poll_codes:
    - "TMZK0014"                   ##ROLL
    - "TMZK0016"                   ##PITCH
    - "TMZK0018"                   ##YAW
    - "TMZK0013_b7b4"              ##Mode
    - "TMZK0013_b3b0"              ##ATT_REF
  telemetry_frame_field_codes:
    attitude_angle_deg: ["TMZK0014", "TMZK0016", "TMZK0018"]
    angular_rate_deg_s: []
    control_mode: "TMZK0013_b7b4"
    attitude_reference: "TMZK0013_b3b0"

simulation:
  max_duration_sec: 300.0
  post_udp_delay_sec: 0.2
  reset_sequence_delay_sec: 3.0
  case_interval_sec: 5.0

telecommand:
  enabled: true
  host: "192.168.10.170"
  port: 4002
  timeout_sec: 2.0
  recv_buffer_size: 4096
  connect_retry_timeout_sec: 20.0
  connect_retry_interval_sec: 5
  channel: "CH1"
  notification_timeout_sec: 30.0
  execution_timeout_sec: 60.0
  interval_sec: 1.0
  initial_delay_sec: 0.0
  post_delay_sec: 0.2

validation:
  judgment_delay_sec: 10.0
