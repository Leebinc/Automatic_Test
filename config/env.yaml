udp:
  host: "127.0.0.1"
  port: 8080
  timeout_sec: 2.0

tcp:
  host: "127.0.0.1"
  port: 9000
  timeout_sec: 2.0
  recv_buffer_size: 4096
  connect_retry_timeout_sec: 20.0
  connect_retry_interval_sec: 0.5
  poll_interval_sec: 0.1
  telemetry_poll_codes:
    - "WX"
    - "WY"
    - "WZ"
    - "MODE"
    - "TIME_MS"
  telemetry_frame_field_codes:
    angular_rate_deg_s: ["WX", "WY", "WZ"]
    control_mode: "MODE"
    timestamp_ms: "TIME_MS"

simulation:
  max_duration_sec: 70.0
  post_udp_delay_sec: 0.2
  reset_sequence_delay_sec: 3.0

telecommand:
  enabled: false
  payload:
    cmd: "set_mode"
    mode: "SUN_ACQUISITION"
  expect_response: true
  append_newline: true
  post_delay_sec: 0.2

validation:
  angular_rate_threshold_deg_s: 0.05
  convergence_hold_sec: 5.0
  stop_when_converged: true
  fail_fast_control_mode: true
  mode_check_grace_sec: 0.0
