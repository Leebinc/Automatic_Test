  port: 26083
  timeout_sec: 2.0

tcp:
  host: "192.168.0.11"
  port: 502
  timeout_sec: 2.0
  recv_buffer_size: 4096
  connect_retry_timeout_sec: 20.0
  connect_retry_interval_sec: 5
  poll_interval_sec: 2.0
  heartbeat_interval_sec: 40.0
  telemetry_poll_codes:
    - "TMZK0014"                   ##ROLL
    - "TMZK0016"                   ##PITCH
    - "TMZK0018"                   ##YAW
    - "TMZK0013_b7b4"              ##Mode
    - "TMZK0013_b3b0"              ##ATT_REF
